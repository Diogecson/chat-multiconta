[build]
  publish = "."
  # Gera version.json com timestamp UTC do build (a cada deploy vira uma versao nova)
  command = "date -u +'{\"v\":\"%Y%m%dT%H%M%SZ\"}' > version.json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "camera=(), microphone=(self), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    # HTML: forca revalidacao total em toda request (bulletproof pra propagar mudancas)
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/version-check.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
